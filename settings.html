<div id="fft_settings" class="extension_container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Floating Frost Telegram UI</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="fft_enabled">
                <input id="fft_enabled" type="checkbox">
                <span>Включить новый интерфейс</span>
            </label>
            <label for="fft_theme">Тема интерфейса</label>
            <select id="fft_theme" class="text_pole">
                <option value="dark">Тёмная</option>
                <option value="light">Светлая</option>
                <option value="glass">Стеклянная iOS</option>
            </select>
            <label for="fft_density">Плотность сообщений</label>
            <select id="fft_density" class="text_pole">
                <option value="comfortable">Комфортная</option>
                <option value="compact">Компактная</option>
            </select>
            <label for="fft_blur">Интенсивность стекла</label>
            <input id="fft_blur" type="range" min="0" max="28" step="1">
            <label class="checkbox_label" for="fft_motion">
                <input id="fft_motion" type="checkbox">
                <span>Плавные анимации</span>
            </label>
            <label class="checkbox_label" for="fft_mobile_effects">
                <input id="fft_mobile_effects" type="checkbox">
                <span>Стеклянные эффекты на мобильных</span>
            </label>
            <label class="checkbox_label" for="fft_desktop_shell">
                <input id="fft_desktop_shell" type="checkbox">
                <span>Трёхколоночный интерфейс на ПК</span>
            </label>
            <label class="checkbox_label" for="fft_mobile_shell_enabled">
                <input id="fft_mobile_shell_enabled" type="checkbox">
                <span>Отдельный мобильный интерфейс</span>
            </label>
            <label class="checkbox_label" for="fft_auto_layout">
                <input id="fft_auto_layout" type="checkbox">
                <span>Автоматически выбирать интерфейс по ширине</span>
            </label>
            <small>Расширение меняет только представление и не заменяет штатные сообщения, свайпы или кнопки.</small>
        </div>
    </div>
</div>
